# Scheduled test runs — single source of truth.
# Edit this file and push to change schedules; no UI editing is available.
# The workflow ticks every hour and runs every enabled schedule whose time has come.
# Cron expressions are interpreted in UTC (same convention as GitHub Actions).
schedules:
  - name: Nightly run
    cron: "0 9 * * *"
    mode: test
    enabled: true
    projectId: default
  - name: Nightly run website
    cron: "0 9 * * *"
    mode: test
    enabled: true
    projectId: my-site
