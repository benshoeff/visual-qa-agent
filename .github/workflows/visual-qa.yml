name: Visual QA Engine

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: test
        type: choice
        options:
          - test
          - baseline
          - crawl
      pages:
        description: Pages (comma-separated) or empty for all
        required: false
        default: ''
        type: string
      url:
        description: Start URL (for crawl)
        required: false
        default: ''
        type: string
      crawl_config:
        description: Crawl config JSON (for crawl)
        required: false
        default: ''
        type: string
      auto_capture_baseline:
        description: Auto-capture baselines (crawl)
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      job_id:
        description: Crawl job id (internal)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run nightly test (scheduled)
        if: github.event_name == 'schedule'
        run: npm run test

      - name: Run crawl
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'crawl'
        env:
          CRAWL_URL: ${{ github.event.inputs.url }}
          CRAWL_CONFIG: ${{ github.event.inputs.crawl_config }}
          CRAWL_JOB_ID: ${{ github.event.inputs.job_id }}
          AUTO_CAPTURE_BASELINE: ${{ github.event.inputs.auto_capture_baseline }}
        run: npm run crawl

      - name: Run test/baseline (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'crawl'
        env:
          PAGES: ${{ github.event.inputs.pages }}
        run: npm run ${{ github.event.inputs.mode }}

      # When re-capturing baselines, old current/diffs are stale — remove them.
      - name: Remove stale current/diffs (baseline update)
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'baseline'
        run: rm -f current/*.png diffs/*.png || true

      - name: Commit results back to git
        if: always()
        run: |
          git config user.name "visual-qa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json schedules.json baselines current diffs reports crawl-results crawl-jobs 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(visual-qa): update test artifacts [skip ci]"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
